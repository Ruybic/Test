<html lang="en">

<style>
:root{--ink:#16324f;--face:#e3ecf4;--face2:#cfdce8;--hi:#fff;--lo:#7d93a8;--t1:#1b4f94;--t2:#74a9de;--pink:#e0388a;--desk1:#2d6aa3;--desk2:#8ec1e8;--bar:#d5e2ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#dbe8f5;--face:#26384b;--face2:#1d2d3d;--hi:#4a6179;--lo:#0d1722;--t1:#0e2f5c;--t2:#3c6ea8;--desk1:#10243a;--desk2:#2b5a8a;--bar:#1b2c3d}}
:root[data-theme="dark"]{--ink:#dbe8f5;--face:#26384b;--face2:#1d2d3d;--hi:#4a6179;--lo:#0d1722;--t1:#0e2f5c;--t2:#3c6ea8;--desk1:#10243a;--desk2:#2b5a8a;--bar:#1b2c3d}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#2d6aa3;font:13px/1.35 Lato,Tahoma,Verdana,sans-serif;color:var(--ink);user-select:none}
#os{position:fixed;inset:0;background:radial-gradient(ellipse at 70% 10%,var(--desk2),var(--desk1) 70%);overflow:hidden}
#os:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 4px);pointer-events:none}
.bev,.btn,.bar button,.bar select,.bar input,.tb button,#start,#sd2,#tasks button{border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi)}
.sunk{border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
button,select,input{font:700 12px Lato;color:var(--ink);background:var(--face)}
#desk{position:absolute;inset:0 0 38px 0}
.ic{position:absolute;width:84px;height:86px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;text-shadow:0 1px 2px #000;font-weight:700;cursor:pointer;padding-top:4px;border-radius:4px;border:1px dashed transparent;touch-action:none}
.ic:hover,.ic:focus,.ic.sel{background:rgba(255,255,255,.18);border-color:#fff8;outline:0}
.ic i{font-style:normal;font-size:28px;width:46px;height:42px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(#fff,#bcd5ec);box-shadow:0 2px 4px #0006,inset 0 0 0 2px #fff8}
.ic span{font-size:12px;text-align:center}
.ic.drag{opacity:.8;z-index:99;cursor:grabbing}.ic.hot i{outline:3px dashed #ff0;transform:scale(1.2)}
.ic.pop{animation:pop .7s}@keyframes pop{0%{transform:scale(0) rotate(-25deg)}60%{transform:scale(1.3)}100%{transform:none}}
#wins{position:absolute;inset:0 0 38px 0;pointer-events:none}
.win{position:absolute;pointer-events:auto;background:var(--face);display:flex;flex-direction:column;box-shadow:4px 6px 0 rgba(0,20,50,.3);max-width:100vw;max-height:calc(100% - 2px);min-width:260px;min-height:160px}
.win.min{display:none}
.tb{display:flex;align-items:center;gap:5px;padding:3px 4px 3px 6px;color:#fff;font-weight:900;background:linear-gradient(90deg,var(--t1),var(--t2));cursor:grab;touch-action:none}
.tb b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 #0006}
.tb button{width:22px;height:20px;padding:0;cursor:pointer}
.bd{flex:1;min-height:0;display:flex;flex-direction:column;margin:3px;background:var(--face2) repeating-linear-gradient(0deg,transparent 0 3px,rgba(120,150,180,.12) 3px 4px);overflow:hidden}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important}
.rz{position:absolute;z-index:5}
.rz[data-d=n],.rz[data-d=s]{left:10px;right:10px;height:8px;cursor:ns-resize}.rz[data-d=n]{top:-4px}.rz[data-d=s]{bottom:-4px}
.rz[data-d=e],.rz[data-d=w]{top:10px;bottom:10px;width:8px;cursor:ew-resize}.rz[data-d=e]{right:-4px}.rz[data-d=w]{left:-4px}
.rz[data-d$=e],.rz[data-d$=w]{width:14px;height:14px}.rz[data-d=ne],.rz[data-d=nw]{top:-5px}.rz[data-d=se],.rz[data-d=sw]{bottom:-5px;top:auto}
.rz[data-d=ne]{right:-5px;cursor:nesw-resize}.rz[data-d=sw]{left:-5px;cursor:nesw-resize}.rz[data-d=nw]{left:-5px;cursor:nwse-resize}.rz[data-d=se]{right:-5px;cursor:nwse-resize}
.bar{display:flex;gap:6px;align-items:center;padding:5px;background:var(--bar);flex-wrap:wrap;border-bottom:1px solid var(--lo)}
.bar button,.bar select,.bar input,.btn{padding:3px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.bar input[type=search]{width:110px}.sp{flex:1}.cnt{font-weight:700;opacity:.75}
.list{flex:1;overflow:auto;padding:5px;display:flex;flex-direction:column;gap:5px;user-select:text}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px;background:var(--face);color:inherit;text-decoration:none;cursor:pointer}.row:hover{background:var(--hi)}
.row .cv{width:76px;height:48px;flex:none}
.av{width:30px;height:30px;border-radius:50%;flex:none;border:2px solid var(--hi)}
.m{flex:1;min-width:0}.m b,.m small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.m small{opacity:.8}
.dt{width:100%;padding:5px 8px;background:var(--bar);font-size:12px;line-height:1.7}.dt a{color:var(--pink);font-weight:900}
.pp{font-weight:900;color:var(--pink);font-size:15px;text-align:right}.pp small{display:block;color:var(--ink);font-size:11px}
.rk{display:inline-block;min-width:18px;text-align:center;font-weight:900;background:var(--t1);color:#fff;padding:0 4px;margin-right:4px}
.md{padding:0 5px;color:#fff;font-size:9px;font-weight:900;display:inline-block;line-height:15px}
.msg{padding:22px;text-align:center;font-weight:700}
.cv{position:relative;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h,210) 60% 55%),hsl(calc(var(--h,210) + 40) 60% 38%));display:grid;place-items:center;color:#fff;font-weight:900}
.cv:before{content:attr(data-l)}.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cv.big{height:110px;font-size:40px}
.cal{padding:10px;display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cal u{text-decoration:none;font-weight:900;opacity:.6;font-size:11px}
.cal span{padding:7px 0;opacity:.35}.cal span.has{opacity:1;cursor:pointer;background:var(--face);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);font-weight:900}
.cal span.has:hover,.cal span.sel{background:var(--pink);color:#fff}
.hero{padding:10px 12px;color:#fff;background:linear-gradient(90deg,var(--t1),var(--pink));font-weight:900;font-size:16px;text-shadow:1px 1px 0 #0006}
.card{display:flex;gap:10px;align-items:center;padding:7px;background:var(--face)}.card .m small{white-space:normal}
.card>i{font-style:normal;font-size:26px;width:46px;height:46px;flex:none;display:grid;place-items:center;background:linear-gradient(#fff,#bcd5ec);border-radius:9px;box-shadow:inset 0 0 0 2px #fff8}
.act{width:120px;text-align:right;flex:none}.act small{display:block}
.pg{height:14px;background:var(--lo);padding:2px;margin-bottom:2px}.pg b{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--pink) 0 8px,transparent 8px 10px)}
.fly{position:fixed;z-index:99999;font-size:30px;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.stats div{background:var(--face);text-align:center;padding:6px;font-size:11px}.stats b{display:block;font-size:20px;color:var(--pink)}
.b2{display:grid;grid-template-columns:70px 1fr 30px;align-items:center;gap:6px;margin-top:4px}.b2 i{height:10px;display:block}
.doc{user-select:text;line-height:1.55;padding:12px 16px;background:var(--hi);margin:5px;flex:1;overflow:auto}.doc h4{margin:12px 0 2px;color:var(--pink)}.doc h3{margin:0}
[hidden]{display:none!important}
.bars{display:flex;align-items:flex-end;gap:2px;height:70px;margin:6px 0}.bars i{flex:1;background:var(--t2);cursor:pointer;min-height:2px}.bars i.sel{background:var(--pink)}
iframe{flex:1;border:0;background:#000;width:100%}
.motd{display:flex;gap:7px;align-items:center;cursor:pointer;padding:2px 8px 2px 3px;height:30px;background:var(--face)}
.motd .cv{width:36px;height:24px;flex:none}.motd small{display:block;font-size:9px;font-weight:900;color:var(--pink);text-transform:uppercase;line-height:1}
.motd b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
#hm{display:none}
#tray{position:absolute;left:0;right:0;bottom:0;height:38px;background:var(--face);display:flex;gap:4px;align-items:center;padding:3px;border-top:2px solid var(--hi);z-index:9999}
#start,#sd2{font:900 14px Lato;display:flex;gap:6px;align-items:center;height:100%;cursor:pointer;color:var(--ink);background:var(--face);padding:2px 10px 2px 4px}#sd2{padding:2px 8px}
#start img{height:22px;border-radius:5px}
#tasks{flex:1;display:flex;gap:4px;overflow:hidden}
#tasks button{max-width:150px;flex:1;height:28px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tasks button.on{border-color:var(--lo) var(--hi) var(--hi) var(--lo);background:var(--hi)}
#clock{padding:4px 10px;font-weight:700;height:28px}
#smenu{position:absolute;left:3px;bottom:40px;width:310px;max-height:calc(100% - 50px);overflow:auto;background:var(--face);display:none;z-index:10000;box-shadow:4px 4px 0 #0004}#smenu.on{display:block}
.sh{display:flex;gap:10px;align-items:center;padding:10px;color:#fff;background:linear-gradient(135deg,var(--t1),var(--pink))}.sh img{height:38px;border-radius:8px}.sh small{display:block;opacity:.9}
.sx{padding:8px 10px;border-bottom:1px solid var(--lo)}.sx>small{display:block;font-weight:900;color:var(--pink);font-size:10px;margin-bottom:3px}
.sx .row{padding:3px;gap:6px;flex-wrap:nowrap}.sx .row .cv{width:44px;height:30px}.sx .pp{font-size:13px}
.sa{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:8px}.sa button{padding:7px;cursor:pointer;border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi)}.sa button:hover{background:var(--t1);color:#fff}
#status,#nav{display:none}
@media(max-width:760px),(pointer:coarse) and (max-width:900px){
 #os{display:flex;flex-direction:column}
 #status{display:flex;justify-content:space-between;padding:4px 12px;height:26px;align-items:center;color:#fff;font-weight:900;font-size:12px;background:#0b1f36cc;position:relative;z-index:9998;flex:none}
 #hm{display:flex;margin:12px 12px 0;height:64px;padding:6px;gap:10px;position:relative;z-index:2}#hm .cv{width:76px;height:50px}#hm b{max-width:none;font-size:14px}
 #desk{position:static;flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:96px;padding:16px 8px;gap:8px 2px;align-content:start;overflow:auto;position:relative}
 .ic{position:relative!important;left:auto!important;top:auto!important;width:auto;height:auto;border:0}.ic i{width:56px;height:56px;font-size:32px;border-radius:14px}.ic:active{transform:scale(.92)}
 #wins{inset:26px 0 44px 0;z-index:50}
 .win{left:0!important;top:0!important;width:100%!important;height:100%!important;max-height:none;box-shadow:none;border:0}.win:not(.top){display:none}
 .tb{cursor:default}.tb button[data-a=m],.rz{display:none}
 #tray,#smenu{display:none!important}
 #nav{display:flex;justify-content:space-around;align-items:center;height:44px;flex:none;background:#0b1f36;position:relative;z-index:9998}
 #nav button{background:none;border:0;color:#fff;font-size:22px;width:80px;height:100%;cursor:pointer}
 .act{width:100px}
}
</style>
</head>
<body>
<div id="os">
 <div id="status"><span id="sclock">--:--</span><span>osu!OS ▂▄▆ 📶 🔋</span></div>
 <div id="hm" class="motd bev"></div>
 <div id="desk"></div>
 <div id="wins"></div>
 <div id="smenu" class="bev"></div>
 <div id="tray"><button id="start"><img src="https://i.imgur.com/Zgd9kDC.jpg" alt="">Start</button><button id="sd2" title="Hide all windows">🖥</button><div id="tasks"></div><div id="tbm" class="motd bev" title="Open Community"></div><div id="clock" class="sunk">--:--</div></div>
 <div id="nav"><button id="bBack" aria-label="Back">◀</button><button id="bHome" aria-label="Home">●</button><button id="bRec" aria-label="Close all">■</button></div>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MODES={osu:'Standard',taiko:'Taiko',fruits:'Catch',mania:'Mania'},MC={osu:'#e0388a',taiko:'#d93a4a',fruits:'#2e9e6b',mania:'#2f7fd1'};
const S={date:null,scores:[],demo:false,avail:new Set(),mode:'all',q:'',loading:false,A:null},D={},W={};
let ST={inst:[],bin:[],pos:{}};try{ST={...ST,...JSON.parse(localStorage.getItem('osuos1')||'{}')}}catch(e){}
const save=()=>{try{localStorage.setItem('osuos1',JSON.stringify(ST))}catch(e){}};
const pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hue=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))&0xffff,7)%360,rd=Math.round;
const fAcc=a=>a==null?'':((a>1?a:a*100).toFixed(2)+'%');
const cv=(b,c='')=>`<div class="cv ${c}" style="--h:${hue(b.title)}" data-l="${esc((b.title||'?')[0])}">${b.cover?`<img loading="lazy" src="${esc(b.cover)}" alt="" onerror="this.remove()">`:''}</div>`;
const mt=m=>`<span class="md" style="background:${MC[m]||MC.osu}">${(MODES[m]||'Standard').toUpperCase()}</span>`;
const avu=u=>`<img class="av" src="${esc(u)}" alt="" onerror="this.style.visibility='hidden'">`,av=id=>avu('https://a.ppy.sh/'+id);
let AC;const beep=(f,d)=>{try{AC??=new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}};
const DEMO=[['Hyunj',412.7,'osu','SS','Secret Love Song'],['Dijla',288.1,'taiko','S','Kokiatsu'],['Basra',301.4,'mania','A','Moonlight Sonata'],['Mosul',190.9,'fruits','S','Blue Zenith'],['Hyunj',250.2,'osu','S','Secret Love Song'],['Erbil',330.5,'osu','SS','Secret Love Song']].map((x,i)=>({score_id:i+1,user:x[0],user_id:i+2,mode:x[2],pp:x[1],accuracy:.97+i/300,rank:x[3],country:'IQ',stars:5.4,mods:i%2?['HD']:[],beatmapset:{id:x[4],title:x[4],cover:''}}));

/* ───── DATA ───── */
function agg(){const P={},M={},Mo={};let pp=0;
 S.scores.forEach(s=>{const m=s.mode||'osu',b=s.beatmapset||{},p=P[s.user]??={name:s.user,id:s.user_id,n:0,pp:0,best:0,acc:0,cc:s.country};
  p.n++;p.pp+=s.pp||0;p.best=Math.max(p.best,s.pp||0);p.acc+=(s.accuracy>1?s.accuracy/100:s.accuracy)||0;
  const x=M[(b.id||b.title)+'|'+m]??={b,mode:m,n:0,top:s,ps:new Set()};x.n++;x.ps.add(s.user);if(s.pp>x.top.pp)x.top=s;Mo[m]=(Mo[m]||0)+1;pp+=s.pp||0});
 const ms=Object.values(M).sort((a,b)=>b.n-a.n||b.top.pp-a.top.pp);S.A={ps:Object.values(P),ms,Mo,pp,motd:ms[0]}}
async function load(ds){S.date=ds;S.loading=true;sync();const[y,m,d]=ds.split('-');
 try{const r=await fetch(`data/${y}/${m}/${d}.json?t=${Date.now()}`);if(!r.ok)throw 0;S.scores=((await r.json()).scores||[]).sort((a,b)=>b.pp-a.pp);S.demo=false}
 catch(e){S.scores=ds===key(new Date())&&!S.avail.size?DEMO:[];S.demo=S.scores===DEMO}
 S.loading=false;agg();motd();sync()}
async function loadIndex(){try{const r=await fetch('data/index.json?t='+Date.now());if(r.ok){const j=await r.json();(j.dates||j.available_dates||Object.keys(j)).forEach(d=>S.avail.add(d));sync()}}catch(e){}}
async function loadCI(){try{const r=await fetch('data/community_insights.json?t='+Date.now());if(r.ok){S.CI=await r.json();motd();sync()}}catch(e){}}
function ciDay(){const ds=S.CI&&S.CI.daily_stats;if(!ds)return null;const k=Object.keys(ds).sort().pop();return{k,...ds[k]}}
function mapOfDay(){const c=ciDay();if(c&&c.most_played_map){const m=c.most_played_map,sc=S.date===c.k?S.scores.find(s=>(s.beatmapset||{}).title==m.title):null;return{title:m.title,cover:m.cover,n:m.unique_players,u:'players',mode:sc?(sc.mode||'osu'):null}}
 const a=S.A&&S.A.motd;return a?{title:a.b.title,cover:a.b.cover,n:a.n,u:'plays',mode:a.mode}:null}
function motd(){const m=mapOfDay(),h=m?`${cv(m)}<div><small>Map of the day</small><b>${esc(m.title)}</b></div>${m.mode?mt(m.mode):''}<small>${m.n} ${m.u}</small>`:`<div><small>Map of the day</small><b>Loading…</b></div>`;$('#tbm').innerHTML=$('#hm').innerHTML=h}

/* ───── APPS ───── */
const jsonApp=(f,head,empty,row,click)=>bd=>{bd.innerHTML=`<div class="bar"><b>${head}</b></div><div class="list"><div class="msg">Loading…</div></div>`;const ls=$('.list',bd);
 fetch(f+'?t='+Date.now()).then(r=>r.ok?r.json():Promise.reject()).then(j=>{const a=Array.isArray(j)?j:j.items||[];ls.innerHTML=a.length?a.map(row).join(''):`<div class="msg">${empty}</div>`;if(click)ls.onclick=e=>click(e,bd)}).catch(()=>ls.innerHTML=`<div class="msg">${empty}</div>`)};
const SYS={
 store:{name:'Store',ico:'🛒',w:540,h:560,build(bd){
  bd.innerHTML='<div class="hero">🛒 osu!OS Store <small style="font-weight:400">· free downloads · 56k friendly</small></div><div class="list"></div>';const ls=$('.list',bd);
  ls.onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.id,a=b.dataset.a;a=='get'?get(id):a=='open'?openApp(id):trash(id)};
  return()=>{ls.innerHTML=Object.entries(CAT).map(([id,a])=>{const d=D[id],on=ST.inst.includes(id);
   const act=d?`<div class="pg"><b style="width:${d.p}%"></b></div><small>${d.t}</small>`:on?`<button class="btn" data-a="open" data-id="${id}">Open</button> <button class="btn" data-a="rm" data-id="${id}" title="Move to Recycle Bin">🗑</button>`:`<button class="btn" data-a="get" data-id="${id}">⬇ Get</button>`;
   return `<div class="card"><i data-ic="${id}">${a.ico}</i><div class="m"><b>${a.name}${a.star?' <span class="md" style="background:var(--pink)">START HERE</span>':''}</b><small>${a.kb} KB · ★★★★☆</small><small>${a.desc}</small></div><div class="act">${act}</div></div>`}).join('')}}},
 bin:{name:'Recycle Bin',ico:'🗑️',w:420,h:360,build(bd){
  bd.innerHTML='<div class="bar"><button id="em">🔥 Empty Bin</button><span class="sp"></span><span class="cnt"></span></div><div class="list"></div>';const ls=$('.list',bd);
  $('#em',bd).onclick=()=>{ST.bin=[];save();renderDesk();sync()};
  ls.onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.id;ST.bin=ST.bin.filter(x=>x!=id);if(b.dataset.a=='rs')ST.inst.push(id);save();renderDesk();sync()};
  return()=>{$('.cnt',bd).textContent=ST.bin.length+' item(s)';ls.innerHTML=ST.bin.length?ST.bin.map(id=>`<div class="card"><i>${CAT[id].ico}</i><div class="m"><b>${CAT[id].name}</b><small>Deleted app</small></div><button class="btn" data-a="rs" data-id="${id}">Restore</button><button class="btn" data-a="del" data-id="${id}">Delete</button></div>`).join(''):'<div class="msg">🗑️ The bin is empty.<br>Drag an app icon here to uninstall it.</div>'}}}
};
const CAT={
 docs:{name:'Documentation',ico:'📖',star:1,w:480,h:520,kb:24,desc:'Transparency & Player Rights from OIT, plus the osu!OS manual.',build(bd){bd.innerHTML=`<div class="doc"><h3>📖 Transparency &amp; Player Rights</h3><small>osu! Iraq Today documentation</small>
<h4>1. The OIT Manifesto</h4>Osu! Iraq Today is a community project that puts Iraqi osu! talent on the map with a daily snapshot of top plays and creations. No sign-in is needed because it only aggregates data that is already public — like sports news for the Top 500 Iraqi players.
<h4>2. How the magic happens</h4>osu! API v2 ➔ GitHub Actions ➔ OIT Database ➔ your browser. A workflow runs once every 24 hours and asks the official API for the top plays of the Top 500 Iraqi players. Only submitted scores are used. Videos are embedded through YouTube so views count for the original creators. Personal Twitter accounts, Discord messages and IP addresses are never tracked.
<h4>3. Untracked status</h4>Top 500 players can opt out of leaderboards and daily recaps. Your scores and profile are filtered out and your name in historical data becomes [Hidden Player]. No login needed — just DM the developer on Discord.
<h4>4. Legal</h4>An independent fan project, not affiliated with ppy Pty Ltd. No ownership is claimed over beatmap backgrounds, audio or YouTube content; copyright holders can ask for removal. The code is MIT-licensed on GitHub.
<h3 style="margin-top:22px">🖥 osu!OS Manual</h3>
<h4>Desktop</h4>Drag icons anywhere. Double-click (tap on phones) to open. Drag an app onto the Recycle Bin to uninstall it; restore it from the bin or re-download it in the Store.
<h4>Windows</h4>Drag the title bar to move, drag any edge or corner to resize. <b>–</b> hides a window (reopen from its icon or the taskbar), <b>▭</b> maximizes, <b>✕</b> closes.
<h4>Taskbar &amp; Start</h4>The Map of the Day sits next to the clock; click it for Community. 🖥 hides every window. Start shows the streak, top plays and top grinder.
<h4>Phone mode</h4>Small screens become a retro Android: home widget, fullscreen apps, ◀ back, ● home, ■ close all.</div>`}},

   if(d.includes('w')){w=Math.max(260,o.w-dx);l=o.l+o.w-w}if(d.includes('n')){h=Math.max(160,o.h-dy);t=o.t+o.h-h}
   Object.assign(el.style,{left:l+'px',top:Math.max(0,t)+'px',width:w+'px',height:h+'px'})};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)});
 const tb=$('.tb',el);
 tb.addEventListener('click',e=>{const t=e.target.dataset?.a;if(t=='x')close(id);if(t=='m')el.classList.toggle('max');if(t=='h'){el.classList.add('min');el.classList.remove('top');tasks()}});
 tb.addEventListener('dblclick',e=>{if(!mob()&&e.target.tagName!='BUTTON')el.classList.toggle('max')});
 tb.addEventListener('pointerdown',e=>{if(mob()||e.target.tagName=='BUTTON'||el.classList.contains('max'))return;const ox=e.clientX-el.offsetLeft,oy=e.clientY-el.offsetTop;
  const mv=ev=>{el.style.left=Math.max(-el.offsetWidth+80,Math.min(innerWidth-80,ev.clientX-ox))+'px';el.style.top=Math.max(0,Math.min(innerHeight-80,ev.clientY-oy))+'px'};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)})}

${m?`<div class="sx"><small>MAP OF THE DAY</small><div class="row" data-go="community">${cv(m)}<div class="m"><b>${esc(m.title)}</b><small>${m.mode?mt(m.mode)+' ':''}${m.n} ${m.u}</small></div></div></div>`:''}

<div class="sx"><small>TOP GRINDER · ${lbl}</small>${g?`<div class="row" data-go="community">${av(g.user_id)}<div class="m"><b>${esc(g.user)}</b><small>${g.count} plays${c.peak_hour_baghdad!=null?' · crowd peaks '+pad(c.peak_hour_baghdad)+':00':''}</small></div></div>`:'<small>—</small>'}</div>

 else if(g=='reset'){Object.keys(W).forEach(close);ST={inst:[],bin:[],pos:{}};save();renderDesk();openApp('store')}else openApp(g)};

$('#sd2').onclick=hideAll;$('#bHome').onclick=hideAll;$('#tbm').onclick=$('#hm').onclick=()=>openApp('community');
